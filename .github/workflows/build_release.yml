name: Build release

on:
  push:
    tags:
      # Push events to matching v*, i.e. v1.0, v20.15.10
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # The version after @ is the firmware release this widget is built for, see the precompiler README.
    - uses: Siryll/wg_display_embedded_precompiler@v0.1.0
